[project]
name = "skeleton-relay"
version = "0.1.0"
description = "强模型定稿骨架 → 本地模型逐任务实现 → 强模型审查 的编排器（脚本版）"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
relay = "orchestrator.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
