# skeleton-relay 项目配置，放在目标项目根目录。
skeleton_tag: skeleton-v1          # 骨架定稿时打的 git tag，接口保护以此为基准
tasks_file: TASKS.md
test_cmd: python -m pytest -q {acceptance}   # {acceptance} 替换为任务的 acceptance 列表

# 整文件冻结，任何任务的 files 都不得命中（fnmatch 语法，* 可跨目录）
protected:
- SPEC.md
- relay.yaml
- tests/*

executor:
  kind: aider                      # aider | dsh
  base_url: http://<vllm-host>:8888/v1   # vLLM；需绕过本机代理直连
  model: deepseek-v4-flash-vision-exp
  max_attempts: 3
  edit_format: diff
  thinking: false                  # 服务端默认思考强度 high；开启时务必设 temperature
  temperature: 0.0                 # 开启思考时用 0.6，0 会陷入重复直到耗尽 max_tokens
  max_tokens: 32768
  context_window: 1048576          # 服务端 max_model_len
